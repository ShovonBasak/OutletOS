name: Build & Deploy

on:
  push:
    branches: [prod]

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/cpfs-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/cpfs-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.NEXT_PUBLIC_API_BASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/OutletOS
            git pull origin prod

            # Rewrite .env.prod from CI values on every deploy
            cat > .env.prod <<EOF
            DOCKER_USERNAME=${DOCKER_USERNAME}
            SECRET_KEY=${SECRET_KEY}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            ALLOWED_HOSTS=${ALLOWED_HOSTS}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            DOMAIN=${DOMAIN}
            EOF

            docker compose -f docker-compose.prod.yml --env-file /home/ubuntu/OutletOS/.env.prod pull
            docker compose -f docker-compose.prod.yml --env-file /home/ubuntu/OutletOS/.env.prod up -d
            docker image prune -f
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
